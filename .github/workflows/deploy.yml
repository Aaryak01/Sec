name: Build and deploy to ECS Express Mode

# ECS Express Mode (unlike App Runner) doesn't build from source — it only
# accepts an already-built image URI. This workflow is what replaces App
# Runner's native "connect a GitHub repo, it builds the Dockerfile itself"
# flow: on every push to master, build the image, push it to ECR, then point
# (or re-point) the Express Mode service at the new image. One-time AWS
# setup this depends on (ECR repo, OIDC role, the two ECS roles) is in the
# deployment checklist — this file alone isn't enough to deploy.
on:
  push:
    branches: [master]

permissions:
  id-token: write # required for OIDC — no long-lived AWS keys stored in GitHub
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsECSDeployRole
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          container-port: 8000
          health-check-path: /health
          execution-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecsInfrastructureRoleForExpressServices
          # These become the running container's actual env vars — the same
          # values that would otherwise be typed into a hosting platform's
          # console. Sourced from GitHub encrypted secrets, never committed.
          environment-variables: |
            [
              {"name": "COHERE_API_KEY", "value": "${{ secrets.COHERE_API_KEY }}"},
              {"name": "AWS_ACCESS_KEY_ID", "value": "${{ secrets.DYNAMODB_AWS_ACCESS_KEY_ID }}"},
              {"name": "AWS_SECRET_ACCESS_KEY", "value": "${{ secrets.DYNAMODB_AWS_SECRET_ACCESS_KEY }}"}
            ]
