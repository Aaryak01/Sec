name: Build and deploy to ECS Express Mode

# ECS Express Mode (unlike App Runner) doesn't build from source — it only
# accepts an already-built image URI. This workflow is what replaces App
# Runner's native "connect a GitHub repo, it builds the Dockerfile itself"
# flow: on every push to master, build the image, push it to ECR, then point
# (or re-point) the Express Mode service at the new image. One-time AWS
# setup this depends on (ECR repo, OIDC role, the two ECS roles) is in the
# deployment checklist — this file alone isn't enough to deploy.
on:
  push:
    branches: [master]

permissions:
  id-token: write # required for OIDC — no long-lived AWS keys stored in GitHub
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Diagnostic: vars.* silently resolves to "" when unset/wrong-scoped,
      # which produces a malformed ARN (empty account segment) and fails
      # AssumeRoleWithWebIdentity with the same generic "not authorized"
      # error as an actual trust-policy mismatch. Printing it here isn't a
      # secret — it's just the target ARN — so it's safe to leave in.
      - name: Print resolved role ARN
        run: echo "Resolved role ARN -> arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsECSDeployRole"

      # Ground-truth check: decodes the REAL OIDC token GitHub issues for
      # this run, requested with the same audience (sts.amazonaws.com) that
      # configure-aws-credentials uses by default — rather than trusting
      # what the docs say the sub/aud *should* be. ACTIONS_ID_TOKEN_REQUEST_
      # URL/TOKEN are auto-injected into every step's env once the job has
      # `permissions: id-token: write` (already set above), no extra wiring
      # needed. Only decoded claims are printed, never the raw token itself
      # — that token is a live bearer credential for the next few minutes,
      # and this workflow currently runs on push (visible to anyone who can
      # read Actions logs on this repo), so it shouldn't sit in a log.
      # Remove this step once the mismatch is found — it's diagnostic only.
      - name: Debug – print actual OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          python3 -c "
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ('sub', 'aud', 'iss', 'repository', 'repository_owner', 'ref', 'event_name'):
              print(f'{key}: {claims.get(key)!r}')
          " "$TOKEN"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsECSDeployRole
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          container-port: 8000
          health-check-path: /health
          execution-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecsInfrastructureRoleForExpressServices
          # These become the running container's actual env vars — the same
          # values that would otherwise be typed into a hosting platform's
          # console. Sourced from GitHub encrypted secrets, never committed.
          environment-variables: |
            [
              {"name": "COHERE_API_KEY", "value": "${{ secrets.COHERE_API_KEY }}"},
              {"name": "AWS_ACCESS_KEY_ID", "value": "${{ secrets.DYNAMODB_AWS_ACCESS_KEY_ID }}"},
              {"name": "AWS_SECRET_ACCESS_KEY", "value": "${{ secrets.DYNAMODB_AWS_SECRET_ACCESS_KEY }}"}
            ]
